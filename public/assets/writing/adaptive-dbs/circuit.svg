<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f6b67"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c96f5b"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1a1f1e" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="830" height="470" fill="#fff"/>

  <!-- Basal ganglia region -->
  <rect x="24" y="128" width="620" height="318" rx="22" fill="#f4f6f5" stroke="#dfe5e2"/>
  <text x="46" y="154" font-size="11" letter-spacing="1.4" fill="#7b8582">BASAL GANGLIA · DEEP IN THE BRAIN</text>

  <!-- Pathways (drawn first so boxes sit on top) -->
  <g stroke="#5f6b67" stroke-width="2" fill="none" marker-end="url(#g)">
    <path d="M330 66 Q230 100 172 168"/>                    <!-- cortex -> striatum -->
    <path d="M430 80 Q448 190 466 300"/>                    <!-- cortex -> STN (hyperdirect) -->
    <path d="M190 228 Q240 270 282 306"/>                   <!-- striatum -> GPi -->
    <path d="M430 330 L382 330"/>                           <!-- STN -> GPi -->
    <path d="M307 360 Q540 470 734 266"/>                   <!-- GPi -> thalamus, under STN -->
    <path d="M734 206 Q734 64 502 54"/>                     <!-- thalamus -> cortex -->
  </g>
  <path d="M142 372 L142 232" stroke="#c96f5b" stroke-width="2.2" stroke-dasharray="6 5" fill="none" marker-end="url(#c)"/>
  <text x="154" y="306" font-size="12" fill="#c96f5b">less dopamine</text>

  <!-- Regions -->
  <g text-anchor="middle" filter="url(#s)">
    <rect x="330" y="22" width="170" height="58" rx="12" fill="#fff" stroke="#c9d0cd"/>
    <rect x="62" y="172" width="160" height="58" rx="12" fill="#fff" stroke="#c9d0cd"/>
    <rect x="232" y="302" width="150" height="58" rx="12" fill="#fff" stroke="#c9d0cd"/>
    <rect x="430" y="302" width="190" height="58" rx="12" fill="#e6f2f2" stroke="#06747b" stroke-width="2"/>
    <rect x="62" y="374" width="160" height="58" rx="12" fill="#fff" stroke="#c96f5b" stroke-dasharray="5 4"/>
    <rect x="660" y="206" width="148" height="58" rx="12" fill="#fff" stroke="#c9d0cd"/>
  </g>
  <g text-anchor="middle" font-size="15" fill="#1a1f1e">
    <text x="415" y="48">Motor cortex</text>
    <text x="415" y="67" font-size="11.5" fill="#7b8582">plans movement</text>
    <text x="142" y="198">Striatum</text>
    <text x="142" y="217" font-size="11.5" fill="#7b8582">relies on dopamine</text>
    <text x="307" y="328">GPi</text>
    <text x="307" y="347" font-size="11.5" fill="#7b8582">the circuit’s brake</text>
    <text x="490" y="328" fill="#06747b" font-weight="600">STN</text>
    <text x="490" y="347" font-size="11.5" fill="#06747b">common DBS target</text>
    <text x="142" y="400" fill="#c96f5b">Substantia nigra</text>
    <text x="142" y="419" font-size="11.5" fill="#c96f5b">dopamine cells lost</text>
    <text x="734" y="232">Thalamus</text>
    <text x="734" y="251" font-size="11.5" fill="#7b8582">relays to cortex</text>
  </g>

  <!-- DBS electrode: passes through cortex, contacts in the STN -->
  <g>
    <line x1="470" y1="0" x2="560" y2="347" stroke="#1a1f1e" stroke-width="5" stroke-linecap="round"/>
    <g fill="#06747b">
      <circle cx="551" cy="311" r="3.6"/><circle cx="554.6" cy="324.5" r="3.6"/><circle cx="558.2" cy="338" r="3.6"/>
    </g>
    <text x="484" y="16" font-size="12" fill="#1a1f1e">DBS electrode</text>
  </g>

  <!-- Legend -->
  <g font-size="11.5" fill="#4a5250">
    <line x1="664" y1="416" x2="700" y2="416" stroke="#5f6b67" stroke-width="2" marker-end="url(#g)"/>
    <text x="710" y="420">signal pathway</text>
    <line x1="664" y1="440" x2="700" y2="440" stroke="#c96f5b" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#c)"/>
    <text x="710" y="444">dopamine (reduced)</text>
  </g>
</svg>
